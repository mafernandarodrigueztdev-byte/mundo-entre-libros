<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Entre Libros - Carrito</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/src/pages/shoppingCart/shopping.css">
</head>

<body>

    <div class="container-fluid">

        <div id="navbar-root"></div>

        <main>

            <!-- Carrito -->
            <h1 class="cart-title">Carrito de Compras</h1>

            <br>

            <div class="container-cart">

                <!-- Columna izquierda: productos del usuario -->
                <div class="cart-products">
                    <h2>Mi carrito</h2>

                    <ul id="lista-carrito">
                        <li class="carrito-vacio" id="mensaje-vacio">
                            Carrito vacío
                        </li>
                    </ul>

                    <a href="/catalog/catalog.html" class="cartbtn">
                        Encontrar más libros
                    </a>
                </div>

                <!-- Columna derecha: resumen -->
                <aside class="resumen-container">

                    <h2>Resumen de tu pedido</h2>

                    <div class="resumen-fila">
                        <span>Productos</span>
                        <span id="resumen-productos">0</span>
                    </div>

                    <div class="resumen-fila">
                        <span>Subtotal</span>
                        <span id="resumen-subtotal">$0.00</span>
                    </div>

                    <div class="resumen-total">
                        <span>Total</span>
                        <span id="resumen-total">$0.00</span>
                    </div>

                    <!-- Método de pago -->
                    <div class="resumen-fila metodo-pago-fila">
                        <label for="metodo-pago" style="font-weight: 700;">
                            Método de pago
                        </label>

                        <select id="metodo-pago" class="form-select mt-2">
                            <option value="cash">Efectivo</option>
                            <option value="card">Tarjeta</option>
                            <option value="transfer">Transferencia</option>
                            <option value="points">Puntos</option>
                        </select>
                    </div>

                    <button class="resumenbtn">
                        Realizar pedido
                    </button>

                </aside>

            </div>

        </main>

        <div id="footer-root"></div>

    </div>

    <!-- Carrito Offcanvas -->
    <div 
        class="offcanvas offcanvas-end" 
        tabindex="-1" 
        id="offcanvasCarrito" 
        aria-labelledby="offcanvasCarritoLabel">

        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="offcanvasCarritoLabel">
                Tu Carrito
            </h5>

            <button 
                type="button" 
                class="btn-close" 
                data-bs-dismiss="offcanvas" 
                aria-label="Cerrar">
            </button>
        </div>

        <div class="offcanvas-body d-flex flex-column justify-content-between">

            <div class="carrito-productos-lista">
                <p class="text-muted text-center my-5">
                    Tu carrito está vacío actualmente.
                </p>
            </div>

            <div class="carrito-offcanvas-footer border-top pt-3">

                <div class="d-flex justify-content-between mb-3 fw-bold fs-5">
                    <span>Total:</span>
                    <span id="total-offcanvas">$0.00</span>
                </div>

                <a href="/shoppingCart/shopping.html" class="btn w-100 py-2 fw-bold">
                    Ver Carrito Completo
                </a>

            </div>

        </div>

    </div>

    <!-- Toast carrito -->
    <div id="toast-carrito" class="toast-notificacion">
        <span class="toast-icono">✔️</span>
        <span class="toast-mensaje">¡Producto agregado al carrito!</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/src/components/layout.js"></script>
    <script type="module" src="/src/auth.js"></script>

    <!-- Carrito conectado a backend -->
    <script src="/src/carrito.js" defer></script>

</body>

</html>
